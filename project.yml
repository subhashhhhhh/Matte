# Generate the Xcode project with: xcodegen generate
name: Instagram
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
targets:
  Instagram:
    type: application
    platform: macOS
    sources:
      - path: Instagram
    settings:
      base:
        PRODUCT_NAME: Instagram
        PRODUCT_BUNDLE_IDENTIFIER: com.subhash.Instagram
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Subhash"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
  # Independent test suite (written separately from the app). Swift Testing, hosted in the app.
  InstagramTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InstagramTests
    dependencies:
      - target: Instagram
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: com.subhash.InstagramTests
schemes:
  Instagram:
    build:
      targets:
        Instagram: all
        InstagramTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [InstagramTests]
      # Tests read and write Application Support (session.json, operations.json). Point the
      # home folder somewhere disposable so they can never touch the real signed-in session.
      environmentVariables:
        CFFIXED_USER_HOME: $(PROJECT_TEMP_DIR)/TestHome
